spring.application.name=inscripciones
server.port=${BACKEND_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inscripciones_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password_local_123}

spring.jpa.hibernate.ddl-auto=none
management.endpoints.web.exposure.include=health

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}